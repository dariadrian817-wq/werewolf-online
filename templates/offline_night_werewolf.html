{% extends 'base.html' %}
{% block title %}Werewolf Action{% endblock %}
{% block body_class %}theme-night{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="text-center">
        <div class="text-6xl">🐺</div>
        <h2 class="text-3xl font-bold text-red-400">Werewolves</h2>
        <p class="text-gray-400 mt-2">Choose someone to eliminate</p>
        <p class="text-sm text-gray-500 mt-1">{{ wolves|join(', ') }}</p>
    </div>

    <form method="POST" class="space-y-2" onsubmit="closeEyes()">
    {% for t in targets %}
    <button type="submit" name="target" value="{{ t.index }}"
            class="w-full bg-gray-800 hover:bg-red-900 border border-gray-700 hover:border-red-600 rounded-lg py-3 text-left px-5 transition">
        {{ t.name }}
    </button>
    {% endfor %}
</form>

<script>
async function closeEyes() {
    // Don't prevent form submission — fire and forget
    speak("Werewolves, close your eyes. Pass the device to the next role.");
}
</script>
</div>
{% endblock %}
