{% extends 'base.html' %}
{% block title %}Vote — Round {{ round }}{% endblock %}
{% block body_class %}theme-day{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="text-center">
        <div class="text-6xl">🗳️</div>
        <h2 class="text-2xl font-bold font-medieval">Who to eliminate?</h2>
        <p class="text-white-900 text-sm mt-1">(Vote as a group, then tap)</p>
    </div>

    <form method="POST" class="space-y-2 max-h-96 overflow-y-auto">
        {% for t in targets %}
        <button type="submit" name="target" value="{{ t.index }}"
                class="w-full bg-gray-900 hover:bg-red-900 border border-gray-700 hover:border-red-600 rounded-lg py-3 text-left px-5 text-gray-100">
            {{ t.name }}
        </button>
        {% endfor %}
        <button type="submit" name="target" value="skip"
                class="w-full bg-gray-700 hover:bg-gray-600 rounded-lg py-3 text-sm mt-3 text-gray-100">
            Skip vote (no elimination)
        </button>
    </form>
</div>
{% endblock %}
