<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a0505">
    <title>{% block title %}Werewolf Online{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ── Base Typography ── */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            color: #f5f0e8;   /* bone white for readability */
        }
        .font-medieval {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.02em;
        }

        /* ═══════════════════════════════════════
           BLOODY THEMES
           ═══════════════════════════════════════ */

        /* ── NIGHT — deep blood, dripping ── */
        .theme-night {
            background:
                radial-gradient(ellipse at top, rgba(139, 0, 0, 0.35) 0%, transparent 60%),
                linear-gradient(180deg, #1a0505 0%, #2d0707 50%, #0a0000 100%);
            position: relative;
            min-height: 100vh;
        }
        .theme-night::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 180px;
            background-image:
                radial-gradient(ellipse 22px 70px at 8% 0%, #8b0000 40%, transparent 65%),
                radial-gradient(ellipse 16px 120px at 18% 0%, #660000 40%, transparent 65%),
                radial-gradient(ellipse 28px 90px at 32% 0%, #8b0000 40%, transparent 65%),
                radial-gradient(ellipse 14px 160px at 47% 0%, #990000 40%, transparent 65%),
                radial-gradient(ellipse 24px 80px at 62% 0%, #8b0000 40%, transparent 65%),
                radial-gradient(ellipse 18px 130px at 78% 0%, #660000 40%, transparent 65%),
                radial-gradient(ellipse 26px 100px at 92% 0%, #8b0000 40%, transparent 65%);
            pointer-events: none;
            z-index: 0;
            animation: blood-pulse 5s ease-in-out infinite;
            opacity: 0.85;
        }
        .theme-night > * {
            position: relative;
            z-index: 1;
        }
        /* Subtle vignette */
        .theme-night::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 0;
        }
        .theme-night > .main-content,
        .theme-night > button,
        .theme-night > .audio-toggle {
            position: relative;
            z-index: 1;
        }

        /* ── DAY — bloody sunset, dried blood ── */
        .theme-day {
            background:
                radial-gradient(ellipse at top, rgba(220, 38, 38, 0.4) 0%, transparent 55%),
                linear-gradient(180deg, #6b1414 0%, #3d0a0a 50%, #1a0505 100%);
            min-height: 100vh;
            position: relative;
        }
        .theme-day::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 100px;
            background-image:
                radial-gradient(ellipse 18px 50px at 15% 0%, #7f1d1d 40%, transparent 65%),
                radial-gradient(ellipse 22px 80px at 45% 0%, #991b1b 40%, transparent 65%),
                radial-gradient(ellipse 16px 60px at 72% 0%, #7f1d1d 40%, transparent 65%),
                radial-gradient(ellipse 20px 90px at 88% 0%, #991b1b 40%, transparent 65%);
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }
        .theme-day > * {
            position: relative;
            z-index: 1;
        }

        /* ── DANGER — maximum blood, werewolf win ── */
        .theme-danger {
            background:
                radial-gradient(ellipse at center, transparent 20%, rgba(139, 0, 0, 0.5) 90%),
                linear-gradient(180deg, #4a0000 0%, #8b0000 50%, #2d0000 100%);
            min-height: 100vh;
            position: relative;
            animation: danger-glow 3s ease-in-out infinite;
        }
        .theme-danger::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(ellipse 30px 120px at 8% 0%, #b91c1c 40%, transparent 65%),
                radial-gradient(ellipse 24px 180px at 22% 0%, #991b1b 40%, transparent 65%),
                radial-gradient(ellipse 32px 150px at 38% 0%, #b91c1c 40%, transparent 65%),
                radial-gradient(ellipse 20px 200px at 54% 0%, #dc2626 40%, transparent 65%),
                radial-gradient(ellipse 28px 130px at 70% 0%, #b91c1c 40%, transparent 65%),
                radial-gradient(ellipse 24px 170px at 85% 0%, #991b1b 40%, transparent 65%),
                radial-gradient(ellipse 30px 110px at 95% 0%, #b91c1c 40%, transparent 65%);
            pointer-events: none;
            z-index: 0;
            animation: blood-pulse 2s ease-in-out infinite;
        }
        .theme-danger > * {
            position: relative;
            z-index: 1;
        }

        /* ── VICTORY — relief, faint warm glow ── */
        .theme-victory {
            background:
                radial-gradient(ellipse at top, rgba(251, 191, 36, 0.2) 0%, transparent 60%),
                linear-gradient(180deg, #2d1a08 0%, #3d2209 50%, #1a0a05 100%);
            min-height: 100vh;
            position: relative;
        }
        .theme-victory::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 20% 30%, #fbbf24, transparent),
                radial-gradient(1px 1px at 60% 70%, #fbbf24, transparent),
                radial-gradient(1.5px 1.5px at 80% 10%, #fbbf24, transparent),
                radial-gradient(1px 1px at 40% 90%, #fbbf24, transparent);
            opacity: 0.4;
            animation: twinkle 4s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        .theme-victory > * {
            position: relative;
            z-index: 1;
        }

        /* ═══════════════════════════════════════
           ANIMATIONS
           ═══════════════════════════════════════ */

        @keyframes blood-pulse {
            0%, 100% { opacity: 0.7; transform: scaleY(1); }
            50% { opacity: 1; transform: scaleY(1.03); }
        }

        @keyframes danger-glow {
            0%, 100% {
                box-shadow: inset 0 0 100px rgba(220, 38, 38, 0.3);
            }
            50% {
                box-shadow: inset 0 0 150px rgba(220, 38, 38, 0.5);
            }
        }

        @keyframes twinkle {
            from { opacity: 0.3; }
            to { opacity: 0.7; }
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .main-content > * {
            animation: fade-in-up 0.5s ease-out;
        }

        @keyframes card-enter {
            0% { transform: scale(0.5) rotateY(180deg); opacity: 0; }
            60% { transform: scale(1.1) rotateY(0deg); opacity: 1; }
            100% { transform: scale(1) rotateY(0deg); opacity: 1; }
        }
        .role-card-animate {
            animation: card-enter 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .death-shake { animation: shake 0.6s ease-in-out; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(5deg); }
        }
        .float-1 { animation: float 3s ease-in-out infinite; }
        .float-2 { animation: float 3s ease-in-out infinite 1s; }
        .float-3 { animation: float 3s ease-in-out infinite 2s; }

        @keyframes pulse-warning {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .countdown-urgent {
            animation: pulse-warning 1s infinite;
            color: #fbbf24;
        }
        .countdown-critical {
            animation: pulse-warning 0.5s infinite;
            color: #ef4444;
        }

        /* ── Button press feedback ── */
        button, a[class*="bg-"] {
            transition: transform 0.1s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }
        button:active, a[class*="bg-"]:active {
            transform: scale(0.97);
        }

        /* ── Prevent text selection on privacy screens ── */
        .no-select {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* ── Privacy transition ── */
        @keyframes privacy-blur-in {
            from { backdrop-filter: blur(0); background: transparent; }
            to { backdrop-filter: blur(20px); background: rgba(0,0,0,0.7); }
        }
        .privacy-transition {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            animation: privacy-blur-in 0.3s ease-out forwards;
        }

        /* ── Bloody accent for key text ── */
        .text-blood {
            color: #dc2626;
            text-shadow: 0 0 20px rgba(220, 38, 38, 0.6), 0 2px 4px rgba(0,0,0,0.8);
        }

        /* ── Bloody card shadow ── */
        .bloody-shadow {
            box-shadow:
                0 0 30px rgba(220, 38, 38, 0.3),
                0 10px 40px rgba(0, 0, 0, 0.7);
        }

        /* ── Audio toggle blood style ── */
        .audio-toggle-btn {
            background: rgba(45, 7, 7, 0.9);
            border: 1px solid #8b0000;
            color: #f5f0e8;
            box-shadow: 0 0 15px rgba(139, 0, 0, 0.5);
        }
        .audio-toggle-btn:hover {
            background: rgba(74, 0, 0, 0.95);
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.7);
        }
    </style>

    {% block head %}{% endblock %}
</head>

<body class="{% block body_class %}theme-night{% endblock %} min-h-screen flex items-center justify-center p-4 transition-all duration-1000">

    <!-- ═══ MAIN CONTENT ═══ -->
    <div class="w-full max-w-md main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- ═══ AUDIO TOGGLE ═══ -->
    <button id="audio-toggle"
            onclick="toggleAudio()"
            class="audio-toggle-btn fixed top-4 right-4 z-50 w-12 h-12 rounded-full
                   text-2xl flex items-center justify-center
                   transition-all duration-200 backdrop-blur"
            title="Toggle sounds"
            aria-label="Toggle audio">
        🔊
    </button>

    <!-- ═══ GLOBAL SCRIPTS ═══ -->
    <script>
    // ─────────────────────────────────────────
    // SPEECH SYNTHESIS
    // ─────────────────────────────────────────
    let audioEnabled = localStorage.getItem('werewolf_audio') !== 'off';

    function speak(text, options = {}) {
        return new Promise((resolve) => {
            if (!audioEnabled || !window.speechSynthesis) {
                resolve();
                return;
            }
            try {
                window.speechSynthesis.cancel();
            } catch (e) {}

            const u = new SpeechSynthesisUtterance(text);
            u.rate = options.rate !== undefined ? options.rate : 0.82;   // slower for horror
            u.pitch = options.pitch !== undefined ? options.pitch : 0.6; // deeper
            u.volume = options.volume !== undefined ? options.volume : 1.0;
            u.lang = options.lang || 'en-US';

            const voices = speechSynthesis.getVoices();
            if (voices.length > 0) {
                const preferred = voices.find(v =>
                    v.name.includes('Google UK English Male') ||
                    v.name.includes('Microsoft David') ||
                    v.name.includes('Daniel') ||
                    v.name.includes('Google US English')
                );
                if (preferred) u.voice = preferred;
            }

            u.onend = resolve;
            u.onerror = resolve;

            try {
                window.speechSynthesis.speak(u);
            } catch (e) {
                resolve();
            }
            setTimeout(resolve, 15000);
        });
    }

    function toggleAudio() {
        audioEnabled = !audioEnabled;
        localStorage.setItem('werewolf_audio', audioEnabled ? 'on' : 'off');
        if (!audioEnabled && window.speechSynthesis) {
            window.speechSynthesis.cancel();
        }
        updateAudioButton();
        if (audioEnabled) {
            speak("Sounds enabled", { rate: 1.0, pitch: 1.0 });
        }
    }

    function updateAudioButton() {
        const btn = document.getElementById('audio-toggle');
        if (btn) {
            btn.textContent = audioEnabled ? '🔊' : '🔇';
            btn.title = audioEnabled ? 'Mute sounds' : 'Enable sounds';
        }
    }

    if (window.speechSynthesis) {
        speechSynthesis.onvoiceschanged = () => { speechSynthesis.getVoices(); };
    }

    // ─────────────────────────────────────────
    // BACK BUTTON BLOCK (privacy)
    // ─────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
        updateAudioButton();

        if (document.body.classList.contains('theme-night')) {
            history.pushState(null, '', location.href);
            window.onpopstate = () => history.pushState(null, '', location.href);
        }
    });

    // ─────────────────────────────────────────
    // UTILITIES
    // ─────────────────────────────────────────
    function sleep(ms) {
        return new Promise(r => setTimeout(r, ms));
    }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
