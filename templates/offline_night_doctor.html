{% extends 'base.html' %}
{% block title %}Doctor Action{% endblock %}
{% block body_class %}theme-night{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="text-center">
        <div class="text-6xl">💊</div>
        <h2 class="text-3xl font-bold text-emerald-400">Doctor</h2>
        <p class="text-gray-400 mt-2">{{ doctor_name }}, choose someone to protect</p>
    </div>
    <form method="POST" class="space-y-2">
        {% for t in targets %}
        <button type="submit" name="target" value="{{ t.index }}"
                class="w-full bg-gray-800 hover:bg-emerald-900 border border-gray-700 hover:border-emerald-600 rounded-lg py-3 text-left px-5 transition">
            {{ t.name }}
        </button>
        {% endfor %}
    </form>
</div>
{% endblock %}
